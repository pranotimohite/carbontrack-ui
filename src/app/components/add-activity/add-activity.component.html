<mat-toolbar color="primary">CarbonTrack - Add Activity</mat-toolbar>

<div class="container">
  <mat-card>
    <h2>Add a new activity</h2>
    <p>Record travel data so the dashboard can calculate your emissions mix.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field class="full" appearance="fill">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let t of types" [value]="t.value">{{ t.view }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="full" appearance="fill">
        <mat-label>Value</mat-label>
        <input matInput type="number" formControlName="value">
      </mat-form-field>

      <mat-form-field class="full" appearance="fill">
        <mat-label>Unit</mat-label>
        <input matInput formControlName="unit">
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        Save Activity
      </button>
      <a mat-button color="accent" routerLink="/">Cancel</a>
    </form>
  </mat-card>
</div>
