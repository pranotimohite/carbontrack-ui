<mat-toolbar color="primary" class="chat-toolbar">
  <span>CarbonTrack Live Chat</span>
</mat-toolbar>

<mat-card class="chat-card">
  <div class="chat-intro">
    <h2>Talk to the CarbonTrack assistant</h2>
    <p>Send a message and receive a response from the backend at <code>/api/ai/bot/chat</code>.</p>
  </div>

  <div class="chat-scroll-container">
  <div *ngFor="let message of messages" class="chat-message" [ngClass]="message.from">
    
    <span class="message-label">
      {{ message.from === 'user' ? 'You' : message.from === 'bot' ? 'Bot' : 'System' }}
    </span>

    <pre class="message-text">{{ message.text }}</pre>

  </div>
</div>

  <form class="chat-form" [formGroup]="form" (ngSubmit)="send()">
    <mat-form-field class="chat-input" appearance="outline">
      <mat-label>Your message</mat-label>
      <input matInput formControlName="prompt" placeholder="Ask the bot a question" [disabled]="isSending" />
    </mat-form-field>
    <button mat-raised-button color="accent" type="submit" [disabled]="form.invalid || isSending">
      {{ isSending ? 'Sending...' : 'Send message' }}
    </button>
  </form>
</mat-card>
